name: Feature request
description: Propose an improvement to the existing public API client.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the public client workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-boundary confirmation
      options:
        - label: This request concerns a public `/api/v1` operation and does not expose a server-only surface.
          required: true
