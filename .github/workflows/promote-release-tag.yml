name: promote release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix, for example 0.2.0
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-tag-promotion
  cancel-in-progress: false

jobs:
  signed-tag:
    name: signed-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-tag-promotion

    steps:
      - name: Verify signed release candidate
        id: candidate
        env:
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release versions must use format X.Y.Z."
            exit 1
          fi

          if [[ "${GITHUB_ACTOR}" != "${GITHUB_TRIGGERING_ACTOR}" ]]; then
            echo "::error::Release promotion reruns must be initiated by the original dispatcher."
            exit 1
          fi

          default_branch="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${RELEASE_REPOSITORY}" \
            --jq '.default_branch')"

          if [[ "${DISPATCH_REF}" != "refs/heads/${default_branch}" ]]; then
            echo "::error::Release promotion must be dispatched from the default branch."
            exit 1
          fi

          release_tag="v${RELEASE_VERSION}"
          candidate_ref="release-candidates/${release_tag}"

          if gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${RELEASE_REPOSITORY}/git/ref/tags/${release_tag}" \
            > /dev/null 2>&1; then
            echo "::error::The public release tag ${release_tag} already exists."
            exit 1
          fi

          ref_state="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${RELEASE_REPOSITORY}/git/ref/tags/${candidate_ref}" \
            --jq '[.object.type, .object.sha] | @tsv')"

          IFS=$'\t' read -r object_type tag_object_sha <<<"${ref_state}"
          if [[ "${object_type}" != 'tag' ]]; then
            echo "::error::Release candidates must be annotated and cryptographically signed."
            exit 1
          fi

          tag_state=''

          for attempt in 1 2 3 4 5 6; do
            tag_state="$(gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${RELEASE_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '[
                .tag,
                .object.type,
                .object.sha,
                (.verification.verified | tostring),
                .verification.reason,
                ((.verification.signature != null) | tostring),
                ((.verification.payload != null) | tostring),
                ((.verification.verified_at != null) | tostring)
              ] | @tsv')"

            IFS=$'\t' read -r \
              tag_name \
              target_type \
              target_sha \
              verified \
              verification_reason \
              has_signature \
              has_payload \
              has_verified_at \
              <<<"${tag_state}"

            if [[ "${verified}" == 'true' ]] && [[ "${verification_reason}" == 'valid' ]]; then
              break
            fi

            if [[ "${attempt}" -lt 6 ]]; then
              sleep 5
            fi
          done

          if [[ "${tag_name}" != "${release_tag}" ]]; then
            echo "::error::The signed tag-object name does not match ${release_tag}."
            exit 1
          fi

          if [[ "${target_type}" != 'commit' ]] || [[ "${target_sha}" != "${RELEASE_SHA}" ]]; then
            echo "::error::The release candidate must directly target the dispatched default-branch commit."
            exit 1
          fi

          if [[ "${verified}" != 'true' ]] || [[ "${verification_reason}" != 'valid' ]]; then
            echo "::error::GitHub did not verify the release-tag signature (reason: ${verification_reason})."
            exit 1
          fi

          if [[ "${has_signature}" != 'true' ]] || \
            [[ "${has_payload}" != 'true' ]] || \
            [[ "${has_verified_at}" != 'true' ]]; then
            echo "::error::The verified release tag is missing signature provenance metadata."
            exit 1
          fi

          {
            echo "candidate_ref=${candidate_ref}"
            echo "release_tag=${release_tag}"
            echo "tag_object_sha=${tag_object_sha}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run the exact package release gate
        env:
          CANDIDATE_REF: ${{ steps.candidate.outputs.candidate_ref }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          release_gate_run_id="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${RELEASE_REPOSITORY}/actions/workflows/tests.yml/dispatches" \
            -f "ref=${CANDIDATE_REF}" \
            --jq '.workflow_run_id')"

          if [[ ! "${release_gate_run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub did not return the package release-gate run ID."
            exit 1
          fi

          gh run watch "${release_gate_run_id}" \
            --repo "${RELEASE_REPOSITORY}" \
            --exit-status

          run_state="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${RELEASE_REPOSITORY}/actions/runs/${release_gate_run_id}" \
            --jq '[.head_sha, .event, .conclusion] | @tsv')"

          IFS=$'\t' read -r run_sha run_event run_conclusion <<<"${run_state}"
          if [[ "${run_sha}" != "${TARGET_SHA}" ]] || \
            [[ "${run_event}" != 'workflow_dispatch' ]] || \
            [[ "${run_conclusion}" != 'success' ]]; then
            echo "::error::The exact candidate commit did not pass the dispatched package release gate."
            exit 1
          fi

          echo "Release gate ${release_gate_run_id} passed for ${RELEASE_TAG} at ${TARGET_SHA}."

      - name: Create protected public release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
          TAG_OBJECT_SHA: ${{ steps.candidate.outputs.tag_object_sha }}
        shell: bash
        run: |
          set -euo pipefail

          created_ref="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${RELEASE_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" \
            -f "sha=${TAG_OBJECT_SHA}" \
            --jq '[.ref, .object.type, .object.sha] | @tsv')"

          IFS=$'\t' read -r created_name created_type created_sha <<<"${created_ref}"
          if [[ "${created_name}" != "refs/tags/${RELEASE_TAG}" ]] || \
            [[ "${created_type}" != 'tag' ]] || \
            [[ "${created_sha}" != "${TAG_OBJECT_SHA}" ]]; then
            echo "::error::GitHub did not create the expected protected release tag."
            exit 1
          fi

          echo "Promoted verified release tag ${RELEASE_TAG}."
